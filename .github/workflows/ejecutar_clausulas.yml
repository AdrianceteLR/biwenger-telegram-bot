name: Ejecutar Reporte de Cláusulas Biwenger

on:
  schedule:
    # Programado para ejecutarse diariamente a las 07:00 UTC (08:00/09:00 Hora España)
    - cron: '45 15 * * *'
    
  # Permite lanzar la ejecución manualmente con un botón desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar librería requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar Script
      env:
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        X_LEAGUE_ID: ${{ secrets.X_LEAGUE_ID }}
        X_USER_ID: ${{ secrets.X_USER_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main_3.py
