name: Biwenger Sniper Bot

on:
  schedule:
    - cron: '32 5 * * *'  # 05:30 UTC = 07:32 Hora Peninsular Española (CEST)
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de Biwenger
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          X_LEAGUE_ID: ${{ secrets.X_LEAGUE_ID || secrets.LEAGUE_ID }}
          X_USER_ID: ${{ secrets.X_USER_ID || secrets.USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
